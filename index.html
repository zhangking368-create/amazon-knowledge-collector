<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚马逊抖音视频知识库 | 思维导图整理工具</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{padding:20px;background:#f5f7fa;max-width:1200px;margin:0 auto}
        .panel{background:#fff;padding:16px;border-radius:10px;margin-bottom:16px;box-shadow:0 1px 4px #00000012}
        textarea,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin:8px 0}
        button{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:4px}
        button.success{background:#029462}
        #result{white-space:pre-wrap;padding:12px;background:#111;color:#39ff14;border-radius:6px;min-height:120px}
    </style>
</head>
<body>
    <div class="panel">
        <h3>抖音链接录入（亚马逊视频素材）</h3>
        <input id="douyinUrl" placeholder="粘贴抖音分享链接">
        <button onclick="fetchVideoContent()">解析视频内容</button>
    </div>

    <div class="panel">
        <h3>内容预览 & 整理</h3>
        <textarea id="contentArea" rows="8" placeholder="视频字幕/文案会加载在这里，可手动修改"></textarea>
        <button class="success" onclick="saveToWorker()">保存至云端知识库</button>
        <button onclick="generateMindText()">生成思维导图文本</button>
    </div>

    <div class="panel">
        <h3>接口返回日志</h3>
        <div id="result"></div>
    </div>

    <script>
        // =====================【配置区，修改这里！】=====================
        const BASE_WORKER = "https://douyin-mind-auto.zhangking368.workers.dev";
        const API_GET_DATA = `${BASE_WORKER}/getData`; // GET读取知识库
        const API_POST_DATA = `${BASE_WORKER}`;        // POST新增数据（根路径）
        // =================================================================

        // 日志打印
        function log(text){
            document.getElementById('result').innerText += `\n${new Date().toLocaleTimeString()} > ${text}`;
        }

        // 读取全部知识库
        async function loadAllData(){
            try{
                const res = await fetch(API_GET_DATA);
                const json = await res.json();
                log("读取知识库："+JSON.stringify(json));
                return json;
            }catch(e){
                log("读取失败:"+e.toString());
            }
        }

        // 提交新内容到Worker
        async function saveToWorker(){
            const content = document.getElementById("contentArea").value.trim();
            if(!content) return log("内容不能为空");
            const url = document.getElementById("douyinUrl").value;
            const payload = {
                videoUrl:url,
                content:content,
                createTime:new Date().toISOString()
            };
            try{
                const resp = await fetch(API_POST_DATA,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify(payload)
                })
                const ret = await resp.json();
                log("保存结果："+JSON.stringify(ret));
            }catch(err){
                log("保存请求异常："+err.message);
            }
        }

        // 模拟解析抖音（后续对接字幕提取工具）
        async function fetchVideoContent(){
            log("当前暂未接入字幕API，粘贴视频文字到文本框即可保存");
        }

        // 生成思维导图结构化文本
        function generateMindText(){
            const raw = document.getElementById("contentArea").value;
            const prompt = `基于下面亚马逊运营视频内容，整理成层级清晰思维导图markdown，只输出思维导图结构：
${raw}`;
            log("思维导图生成指令已就绪，复制prompt丢给AI：\n"+prompt);
        }

        // 页面加载自动拉取知识库
        window.onload = ()=>loadAllData();
    </script>
</body>
</html>
